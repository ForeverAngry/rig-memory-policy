[package]
name = "rig-memory-policy"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
readme = "README.md"
description = "Backend-agnostic memory-policy primitives (frame metadata, content-hash dedup) shared by Rig memory-store adapters."
repository = "https://github.com/ForeverAngry/rig-memory-policy"
authors = ["ForeverAngry"]
keywords = ["rig", "memory", "ai", "agent", "dedup"]
categories = ["text-processing"]

[dependencies]
blake3 = { version = "1", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tracing = "0.1.41"

[lints.clippy]
dbg_macro = "forbid"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
expect_used = "deny"
expect_fun_call = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "forbid"
unimplemented = "forbid"
unreachable = "deny"
unwrap_used = "deny"

[profile.release]
lto = true
opt-level = "s"
